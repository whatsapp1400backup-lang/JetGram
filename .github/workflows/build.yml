name: Build JetGram APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 27.2.12479018 and SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "ndk;27.2.12479018" "build-tools;36.0.0"

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JetGram-debug-apk
          path: TMessagesProj_App/build/outputs/apk/debug/*.apk
